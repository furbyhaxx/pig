# SPDX-License-Identifier: MIT

name: Feature request
description: Propose a capability for this fork
title: "feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the implementation.
        Do not include credentials, customer data, private configuration or internal-only endpoints.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem and who encounters it.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Required outcome
      description: Describe the observable result that would solve the problem.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Agent loop or providers
        - TUI or editor
        - Extension API or SDK
        - Build, release or packaging
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Acceptance evidence
      description: Describe the user-path test, invalid inputs and failure paths that would prove the outcome.
    validations:
      required: true
