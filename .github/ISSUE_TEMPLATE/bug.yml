# SPDX-License-Identifier: MIT

name: Bug report
description: Report something this fork got wrong
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        This is a personal fork; reports go to its owner, not to PiG or Pi.
        Do not report an undisclosed vulnerability here. Follow .github/SECURITY.md instead.
        Do not include credentials, customer data, private configuration or internal-only endpoints.
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Paste the error or describe the wrong result.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pig --version`, if you have it.
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, architecture, terminal and installation method.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How to make it happen again.
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What you expected instead.
