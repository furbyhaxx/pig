# SPDX-License-Identifier: MIT
name: Personal fork

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-fork
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'furbyhaxx/pig'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    outputs:
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          # GITHUB_TOKEN cannot push merges that change .github/workflows; PIG_SYNC_TOKEN needs contents and workflows write.
          token: ${{ secrets.PIG_SYNC_TOKEN || github.token }}
      - name: Merge upstream; fork-owned files keep the fork side
        id: sync
        run: bash automation/release/personal-fork-sync.sh
      - name: Keep inherited upstream workflows disabled
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/actions/workflows" --paginate \
            --jq '.workflows[] | select(.path != ".github/workflows/personal-fork.yml" and .state == "active") | .id' |
            while read -r workflow; do
              gh api --method PUT "repos/$REPOSITORY/actions/workflows/$workflow/disable"
            done
  release:
    needs: sync
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .go-version
      - name: Build and upload the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PIG_UPDATE_SIGNING_KEY: ${{ secrets.PIG_UPDATE_SIGNING_KEY }}
          REPOSITORY: ${{ github.repository }}
        run: bash automation/release/personal-fork.sh

  verify:
    needs: release
    if: needs.release.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            suffix: linux-arm64.tar.gz
          - runner: macos-15
            suffix: darwin-arm64.tar.gz
          - runner: windows-latest
            suffix: windows-amd64.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the draft asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: v${{ needs.release.outputs.version }}
          ASSET: pig-${{ needs.release.outputs.version }}-${{ matrix.suffix }}
          DIR: ${{ runner.temp }}/release-smoke
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$REPOSITORY" --pattern "$ASSET" --dir "$DIR"
      - name: Run the archive natively
        shell: bash
        env:
          ASSET: pig-${{ needs.release.outputs.version }}-${{ matrix.suffix }}
          DIR: ${{ runner.temp }}/release-smoke
        run: |
          set -euo pipefail
          root="$DIR"
          if command -v cygpath >/dev/null 2>&1; then root=$(cygpath -u "$DIR"); fi
          mkdir -p "$root/extracted"
          case "$ASSET" in
            *.zip) unzip -q "$root/$ASSET" -d "$root/extracted" ;;
            *.tar.gz) tar -xzf "$root/$ASSET" -C "$root/extracted" ;;
            *) echo "unsupported release asset: $ASSET" >&2; exit 1 ;;
          esac
          binary=$(find "$root/extracted" -type f \( -name pig -o -name pig.exe \) -print -quit)
          test -n "$binary"
          "$binary" --version
          "$binary" update --self --no-approve

  publish:
    needs: [release, verify]
    if: needs.release.outputs.version != '' && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: v${{ needs.release.outputs.version }}
        run: gh release edit "$TAG" --repo "$REPOSITORY" --draft=false --prerelease=false --latest
